name: publish-tracing-gcp-formatter
on:
  push:
    tags:
      - tracing-gcp-formatter-[0-9]+.[0-9]+.[0-9]+
jobs:
  Publish:
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Publish
        run: cargo publish --package tracing-gcp-formatter --target x86_64-unknown-linux-gnu
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
